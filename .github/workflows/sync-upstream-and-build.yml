name: 同步上游并构建 Windows 便携版

# 这个仓库只做「跟随上游 + 编译打包」，不改任何功能代码。
#   1) sync   : 拉上游 tidain/YunX-Desktop 的 main，合并进本仓库 main 并 push
#   2) build  : 在 windows-2022 上跑上游自带的 portable-package.ps1，产出 YunX-Desktop.exe
#   3) release: 打成 YunX-Desktop-portable-v<版本>.zip 并挂到本仓库 Releases（tag 沿用上游版本号）
#
# 触发方式：每天定时 / 手动 Run workflow（可勾 force 强制重构建同版本）
#
# 注意（踩过的坑）：GitHub Actions 的 `shell: powershell` 会把 run 脚本以 **无 BOM 的 UTF-8**
# 写成临时 .ps1，而 Windows PowerShell 5.1 会把无 BOM 的 UTF-8 当 ANSI 读 → 中文变乱码 →
# 字符串引号错位 → 整个脚本解析失败（Unresolved token / ParserError），一步都不会执行。
# 所以下面所有 `run:` 脚本一律**只用 ASCII**，中文只出现在 YAML 的 name/注释/body 里。
# 上游 pr-portable.yml 的 6 次失败就是踩了这一条（throw "7z 打包失败" 里有中文）。

on:
  schedule:
    # UTC 21:00 = 北京时间 05:00（GitHub Actions 的 cron 一律按 UTC）
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建（即使该版本已经发过 Release）'
        required: false
        type: boolean
        default: false

# fork 仓库的定时任务需要手动启用一次；GitHub 还会在 60 天无活动后自动暂停定时任务。
permissions:
  contents: write

concurrency:
  group: sync-upstream-and-build
  cancel-in-progress: false

jobs:
  sync:
    name: 同步上游代码
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      need_build: ${{ steps.decide.outputs.need_build }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      synced: ${{ steps.merge.outputs.synced }}
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 合并上游 main
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE="$(git rev-parse HEAD)"

          git remote add upstream https://github.com/tidain/YunX-Desktop.git 2>/dev/null || true
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "upstream: no new commits"
            echo "synced=false" >> "$GITHUB_OUTPUT"
          else
            echo "upstream new commit: $(git log -1 --format='%h %s' FETCH_HEAD)"
            # conflicts: always keep this repo's version (README is our landing page)
            if ! git merge --no-edit -X ours FETCH_HEAD; then
              echo "::warning::merge conflict not resolved by -X ours; aligning to upstream then re-applying fork files"
              git merge --abort || true
              git reset --hard FETCH_HEAD
              # 我方补丁文件必须一起回放，否则 reset --hard 会把微云支持整体丢掉
              git checkout "$BEFORE" -- README.md README.upstream.md .github/workflows/sync-upstream-and-build.yml \
                desktop/src/main/kotlin/com/yunx/app/data/network/WeiyunApi.kt \
                desktop/src/main/kotlin/com/yunx/app/data/network/WeiyunConstants.kt \
                desktop/src/main/kotlin/com/yunx/app/data/repository/WeiyunResolveRepository.kt \
                desktop/src/main/kotlin/com/yunx/app/data/network/ShareLinkParser.kt \
                desktop/src/main/kotlin/com/yunx/app/data/download/DownloadPlatform.kt \
                desktop/src/main/kotlin/com/yunx/app/ui/viewmodel/ResolveViewModel.kt \
                desktop/src/main/kotlin/com/yunx/app/ui/MainScreen.kt \
                desktop/src/main/kotlin/com/yunx/app/ui/clipboard/ClipboardLinkPopup.kt \
                desktop/src/main/kotlin/com/yunx/app/ui/screens/ResolveScreen.kt
              git add -A
              git commit -m "chore: sync upstream and re-apply fork files" || true
            fi
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi

          # 上游 README 原文备份（保留原作者文档与版权声明）
          git show FETCH_HEAD:README.md > README.upstream.md
          if ! git diff --quiet HEAD -- README.upstream.md; then
            git add README.upstream.md
            git commit -m "docs: refresh README.upstream.md from upstream"
          fi

          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            git push origin HEAD:main
            echo "pushed to main"
          else
            echo "nothing to push"
          fi

      - name: 判断是否需要构建
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -eo pipefail
          # single source of version: first line of upstream version.txt
          VER="$(head -n1 version.txt | tr -d '[:space:]')"
          if [ -z "$VER" ]; then echo "::error::version.txt is empty"; exit 1; fi
          # 我方补丁版用独立命名空间，避免与上游 v<版本> 抢 tag、也便于补丁迭代再发版
          TAG="v$VER-wx"
          echo "version=$VER tag=$TAG"

          NEED="false"
          if [ "$FORCE" = "true" ]; then
            echo "force=true -> build anyway"
            NEED="true"
          elif gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists, skip build (use force to rebuild)"
          else
            echo "release $TAG not found -> build"
            NEED="true"
          fi

          echo "version=$VER"     >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "need_build=$NEED" >> "$GITHUB_OUTPUT"

  build:
    name: 构建并发布 Windows 便携版
    needs: sync
    if: needs.sync.outputs.need_build == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: 检出（同步后的 main）
        uses: actions/checkout@v4
        with:
          ref: main

      # 上游同步可能把补丁"合并成功但内容消失"（重构挪走注册行），构建前先断言一遍
      - name: 校验微云补丁仍在
        shell: bash
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          test -f desktop/src/main/kotlin/com/yunx/app/data/repository/WeiyunResolveRepository.kt || fail "缺少 WeiyunResolveRepository.kt"
          test -f desktop/src/main/kotlin/com/yunx/app/data/network/WeiyunApi.kt || fail "缺少 WeiyunApi.kt"
          grep -q "WEIYUN" desktop/src/main/kotlin/com/yunx/app/data/network/ShareLinkParser.kt || fail "ShareLinkParser 未注册 WEIYUN"
          grep -q "SharePlatform.WEIYUN -> weiyunResolveRepository" desktop/src/main/kotlin/com/yunx/app/ui/viewmodel/ResolveViewModel.kt || fail "ResolveViewModel 未分发 WEIYUN"
          grep -q "WeiyunResolveRepository(weiyunApi)" desktop/src/main/kotlin/com/yunx/app/ui/MainScreen.kt || fail "MainScreen 未注入微云仓库"
          echo "微云补丁校验通过"

      # Temurin 17 自带 jpackage；portable-package.ps1 的 Ensure-Jdk 通过 JAVA_HOME 找到它
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 冷启动能省 2~3 分钟
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 与上游 pr-portable.yml 相同的打包入口：Kotlin 编译 + darkmode.dll(MSVC) + jar 裁剪
      # + JCEF 语言包裁剪 + jlink 运行时 + jpackage + 自研启动器
      - name: 构建便携包
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\portable-package.ps1
          $exe = '.\release\YunX-Desktop\YunX-Desktop.exe'
          if (-not (Test-Path $exe)) { throw "portable exe not found: $exe" }
          $kb = [math]::Round((Get-Item $exe).Length / 1KB, 0)
          $mb = [math]::Round(((Get-ChildItem '.\release\YunX-Desktop' -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)
          Write-Host "portable dir ready: $mb MB, launcher $kb KB"

      # 用 Windows 自带的 bsdtar 打 zip（tar.exe 是系统组件；7z 在 runner 上不一定在 PATH）
      # 再兜底 Compress-Archive，最后自检 zip 结构
      - name: 打包为 zip
        id: zip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $v    = '${{ needs.sync.outputs.version }}'
          $name = "YunX-Desktop-portable-v$v-wx"
          $src  = '.\release\YunX-Desktop'
          if (-not (Test-Path (Join-Path $src 'YunX-Desktop.exe'))) { throw "missing $src\YunX-Desktop.exe" }
          if (Test-Path "$name.zip") { Remove-Item "$name.zip" -Force }

          $done = $false
          if (Get-Command tar.exe -ErrorAction SilentlyContinue) {
            Push-Location '.\release'
            try {
              & tar.exe -a -c -f "..\$name.zip" 'YunX-Desktop'
              if ($LASTEXITCODE -eq 0 -and (Test-Path "..\$name.zip")) { $done = $true }
              else { Write-Host "tar exit=$LASTEXITCODE" }
            } finally { Pop-Location }
          }
          if (-not $done) {
            Write-Host '::warning::tar unavailable or failed, falling back to Compress-Archive'
            Compress-Archive -Path $src -DestinationPath "$name.zip" -CompressionLevel Optimal -Force
            $done = Test-Path "$name.zip"
          }
          if (-not $done) { throw 'zip failed: neither tar nor Compress-Archive worked' }

          # verify artifact: openable, entry count, exe at zip root
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "$name.zip").Path)
          try {
            $entries = $z.Entries.Count
            $hasExe  = @($z.Entries | Where-Object { $_.FullName -eq 'YunX-Desktop/YunX-Desktop.exe' }).Count -gt 0
          } finally { $z.Dispose() }
          if (-not $hasExe) { throw "zip has no YunX-Desktop/YunX-Desktop.exe (entries=$entries)" }

          $mb = [math]::Round((Get-Item "$name.zip").Length / 1MB, 1)
          Write-Host "artifact: $name.zip ($mb MB, $entries entries, exe present)"
          "name=$name" >> $env:GITHUB_OUTPUT
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "### Portable: $name.zip ($mb MB, $entries entries)`n")

      # 安装版是加分项：需要 Inno Setup（脚本会自动下载安装），失败不影响便携包发布
      - name: 尝试构建安装版（失败不阻塞）
        continue-on-error: true
        shell: powershell
        run: .\installer-package.ps1

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: |
            YunX-Desktop-portable-*.zip
            release/*.exe
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.sync.outputs.tag }}
          name: 云析 YunX ${{ needs.sync.outputs.tag }} · Windows 封装版
          fail_on_unmatched_files: false
          files: |
            YunX-Desktop-portable-*.zip
            release/*.exe
          body: |
            ## 云析 YunX ${{ needs.sync.outputs.version }}-wx · Windows 便携版（含腾讯微云支持）

            本产物由 **本仓库自动构建**：同步上游代码 → 跑上游自带的 `portable-package.ps1` → 打包 zip。
            代码版权归原作者所有，详见 [README](https://github.com/${{ github.repository }}/blob/main/README.md)。

            ### 下载
            - `YunX-Desktop-portable-v${{ needs.sync.outputs.version }}-wx.zip` —— 解压后双击 `YunX-Desktop.exe` 即可，无需安装
            - 若安装版也构建成功，会额外附带 `YunX-Desktop-setup-*.exe`

            ### 本版新增（相对上游）
            - **腾讯微云（share.weiyun.com）分享解析**：粘贴微云分享链接即可浏览文件、取直链下载；免登录，支持目录与 Range 分片

            ### 注意
            - 程序未做代码签名，首次运行若被 SmartScreen 拦，点「更多信息 → 仍要运行」
            - 视频预览与磁力下载所需的 FFmpeg / Gopeed 不随包发布，首次使用时在「设置 → 引擎管理」里下载
            - **不建议使用百度网盘**（原作者提示有账号风控风险）

            ### 来源
            - 上游（桌面端）：https://github.com/tidain/YunX-Desktop
            - 上游（安卓端）：https://github.com/CYQawa/YunX
            - 上游对应版本发布说明：https://github.com/tidain/YunX-Desktop/releases/tag/${{ needs.sync.outputs.tag }}
            - 协议：AGPL-3.0
