name: 同步上游并构建 Windows 便携版

# 这个仓库只做「跟随上游 + 编译打包」，不改任何功能代码。
#   1) sync  : 拉上游 tidain/YunX-Desktop 的 main，合并进本仓库 main 并 push
#   2) build : 在 windows-2022 上跑上游自带的 portable-package.ps1，产出 YunX-Desktop-portable-v<版本>.zip
#   3) release: 把 zip 挂到这个仓库的 Releases，tag 沿用上游版本号 v<版本>
#
# 触发方式：每天定时 / 手动 Run workflow（可勾 force 强制重构建同版本）

on:
  schedule:
    # UTC 21:00 = 北京时间 05:00（GitHub Actions 的 cron 一律按 UTC）
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建（即使该版本已经发过 Release）'
        required: false
        type: boolean
        default: false

# fork 仓库的定时任务需要手动启用一次；GitHub 还会在 60 天无活动后自动暂停定时任务。
permissions:
  contents: write

concurrency:
  group: sync-upstream-and-build
  cancel-in-progress: false

jobs:
  sync:
    name: 同步上游代码
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      need_build: ${{ steps.decide.outputs.need_build }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      synced: ${{ steps.merge.outputs.synced }}
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 合并上游 main
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE="$(git rev-parse HEAD)"

          git remote add upstream https://github.com/tidain/YunX-Desktop.git 2>/dev/null || true
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "上游没有新提交，本仓库已是最新。"
            echo "synced=false" >> "$GITHUB_OUTPUT"
          else
            echo "上游有新提交：$(git log -1 --format='%h %s' FETCH_HEAD)"
            # 冲突一律保留本仓库版本（README 是本仓库的说明页），其余文件正常合并
            if ! git merge --no-edit -X ours FETCH_HEAD; then
              echo "::warning::合并冲突且 -X ours 未能解决，改为对齐上游后重新应用本仓库定制文件"
              git merge --abort || true
              git reset --hard FETCH_HEAD
              git checkout "$BEFORE" -- README.md README.upstream.md .github/workflows/sync-upstream-and-build.yml
              git add -A
              git commit -m "chore: 同步上游并重新应用本仓库定制文件" || true
            fi
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi

          # 上游 README 原文备份（AGPL 要求保留原作者版权声明与文档）
          git show FETCH_HEAD:README.md > README.upstream.md

          if ! git diff --quiet HEAD -- README.upstream.md; then
            git add README.upstream.md
            git commit -m "docs: 同步上游 README 原文备份"
          fi

          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            git push origin HEAD:main
            echo "已推送同步结果到 main"
          else
            echo "无需推送"
          fi

      - name: 判断是否需要构建
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -eo pipefail
          # 版本号唯一来源：上游 version.txt 第一行
          VER="$(head -n1 version.txt | tr -d '[:space:]')"
          if [ -z "$VER" ]; then echo "::error::version.txt 为空"; exit 1; fi
          TAG="v$VER"
          echo "上游版本：$VER，目标 tag：$TAG"

          NEED="false"
          if [ "$FORCE" = "true" ]; then
            echo "手动指定了 force=true，强制构建"
            NEED="true"
          elif gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "该版本已有 Release，跳过构建（需要重建请手动 Run 并勾 force）"
          else
            echo "该版本尚未发布，开始构建"
            NEED="true"
          fi

          echo "version=$VER"       >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "need_build=$NEED"   >> "$GITHUB_OUTPUT"

  build:
    name: 构建并发布 Windows 便携版
    needs: sync
    if: needs.sync.outputs.need_build == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: 检出（同步后的 main）
        uses: actions/checkout@v4
        with:
          ref: main

      # Temurin 17 自带 jpackage；portable-package.ps1 的 Ensure-Jdk 通过 JAVA_HOME 找到它
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 冷启动能省 2~3 分钟
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 与上游 pr-portable.yml 完全相同的打包入口：Kotlin 编译 + darkmode.dll(MSVC)
      # + jar 裁剪 + JCEF 语言包裁剪 + jlink 运行时 + jpackage + 自研启动器
      - name: 构建便携包
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\portable-package.ps1
          if (-not (Test-Path '.\release\YunX-Desktop\YunX-Desktop.exe')) {
            throw '构建结束但没有找到 release\YunX-Desktop\YunX-Desktop.exe'
          }
          Write-Host ('exe size = ' + [math]::Round((Get-Item '.\release\YunX-Desktop\YunX-Desktop.exe').Length/1KB,0) + ' KB')

      - name: 打包为 zip
        id: zip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ needs.sync.outputs.version }}'
          $name = "YunX-Desktop-portable-v$v"
          Push-Location .\release
          try {
            & 7z a -tzip -mx=5 "..\$name.zip" "YunX-Desktop" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z 打包失败，exit=$LASTEXITCODE" }
          } finally { Pop-Location }
          $mb = [math]::Round((Get-Item "$name.zip").Length / 1MB, 1)
          Write-Host "产物：$name.zip（$mb MB）"
          "name=$name" >> $env:GITHUB_OUTPUT
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "### 便携包：$name.zip（$mb MB）`n")

      # 安装版是加分项：需要 Inno Setup（脚本会自动下载安装），失败不影响便携包发布
      - name: 尝试构建安装版（失败不阻塞）
        continue-on-error: true
        shell: powershell
        run: .\installer-package.ps1

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: |
            YunX-Desktop-portable-*.zip
            release/*.exe
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.sync.outputs.tag }}
          name: 云析 YunX ${{ needs.sync.outputs.tag }} · Windows 封装版
          fail_on_unmatched_files: false
          files: |
            YunX-Desktop-portable-*.zip
            release/*.exe
          body: |
            ## 云析 YunX ${{ needs.sync.outputs.version }} · Windows 便携版

            本产物由 **本仓库自动构建**（同步上游代码 → 跑上游自带的 `portable-package.ps1` → 打包）。
            代码版权归原作者所有，详见 [README](https://github.com/${{ github.repository }}/blob/main/README.md)。

            ### 下载
            - `YunX-Desktop-portable-v${{ needs.sync.outputs.version }}.zip` —— 解压后双击 `YunX-Desktop.exe` 即可，无需安装
            - 若同时构建成功，还会附带 `YunX-Desktop-setup-*.exe` 安装版

            ### 注意
            - 程序未做代码签名，首次运行若被 SmartScreen 拦，点「更多信息 → 仍要运行」
            - 视频预览与磁力下载所需的 FFmpeg / Gopeed 不随包发布，首次使用时在「设置 → 引擎管理」里下载
            - **不建议使用百度网盘**（原作者提示有账号风控风险）

            ### 来源
            - 上游（桌面端）：https://github.com/tidain/YunX-Desktop
            - 上游（安卓端）：https://github.com/CYQawa/YunX
            - 上游对应版本发布说明：https://github.com/tidain/YunX-Desktop/releases/tag/${{ needs.sync.outputs.tag }}
            - 协议：AGPL-3.0
